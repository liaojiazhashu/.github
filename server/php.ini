; ==========================================================================
;  PHP 8.4.27 · 荒启科幻 银河图书馆动态系统（项目专用配置）
;  启动方式：php.exe -c D:\AITEST\huangqi-scifi\server\php.ini -S ...
;  说明：本文件只约束本项目；D:\webserver\php\php.ini 仍服务既有站点
;  原则：报错不外泄、能力最小化、上传与执行彻底隔离
; ==========================================================================

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
max_execution_time = 120
max_input_time = 120
max_input_vars = 2000
memory_limit = 512M
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 8192
error_log = "D:\AITEST\huangqi-scifi\server\storage\logs\php-error.log"
report_memleaks = On
; 不把函数实参写进异常堆栈 —— 防止 API Key / 密码随日志泄漏
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 64

date.timezone = Asia/Shanghai
default_charset = "UTF-8"
internal_encoding = "UTF-8"
default_mimetype = "text/html"

; ---- 安全基线（对应文档 §11.3 / §11.9）----
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
enable_dl = Off
cgi.fix_pathinfo = 0
; 只允许访问应用目录与临时目录
open_basedir = "D:\AITEST\huangqi-scifi\server;D:\hqlib\tmp"
; 必须在 open_basedir 之内，否则 tempnam()/file_put_contents 临时文件会直接失败
sys_temp_dir = "D:\hqlib\tmp"
; 危险函数一律禁用：命令执行、进程控制、动态加载
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,dl,putenv,apache_setenv,phpinfo

[Session]
session.save_handler = files
session.save_path = "D:\hqlib\tmp\sessions"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.cookie_secure = 0
session.cookie_lifetime = 0
session.gc_maxlifetime = 1800
session.sid_length = 48
session.sid_bits_per_character = 6
session.serialize_handler = php_serialize
session.upload_progress.enabled = Off

[Assertion]
zend.assertions = -1

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 12000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.jit = off
opcache.jit_buffer_size = 0

[curl]
curl.cainfo = "D:\webserver\php\extras\ssl\cacert.pem"

[openssl]
openssl.cafile = "D:\webserver\php\extras\ssl\cacert.pem"

[mbstring]
mbstring.language = Chinese
mbstring.internal_encoding = UTF-8
mbstring.http_input = UTF-8
mbstring.http_output = UTF-8
mbstring.encoding_translation = Off
mbstring.substitute_character = "none"

[gd]
gd.jpeg_ignore_warning = 1

[fileuploads]
file_uploads = On
upload_tmp_dir = "D:\hqlib\tmp\uploads"
upload_max_filesize = 32M
max_file_uploads = 60
post_max_size = 40M

[pcre]
pcre.backtrack_limit = 1000000
pcre.recursion_limit = 100000

[mail]
mail.add_x_header = Off

[CLI Server]
cli_server.color = Off

[ExtensionList]
extension_dir = "D:\webserver\php\ext"
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=sodium
extension=zip
; OPcache 必须用 zend_extension 加载（Windows 官方包如此），用 extension= 会静默失败
zend_extension="D:\webserver\php\ext\php_opcache.dll"
